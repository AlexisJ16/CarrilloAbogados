# =============================================================================
# Client Service - Gestión de Clientes, Leads y Autenticación
# =============================================================================

server:
  port: 8200
  servlet:
    context-path: /client-service

spring:
  application:
    name: CLIENT-SERVICE
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:carrillo_legal_tech}?currentSchema=${POSTGRES_SCHEMA_CLIENTS:clients}
    username: ${POSTGRES_USER:carrillo}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: ${POSTGRES_SCHEMA_CLIENTS:clients}
  flyway:
    enabled: false
    baseline-on-migrate: true
    schemas: ${POSTGRES_SCHEMA_CLIENTS:clients}

# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-min-64-chars-required-for-hs512}
    issuer: ${JWT_ISSUER:carrillo-abogados}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}

# NATS Messaging
nats:
  enabled: ${NATS_ENABLED:false}
  server: ${NATS_SERVER:nats://localhost:4222}
  connection-name: client-service
  reconnect:
    max-attempts: 60
    wait-seconds: 2

# Resilience4j Circuit Breaker
resilience4j:
  circuitbreaker:
    instances:
      clientService:
        register-health-indicator: true
        event-consumer-buffer-size: 10
        automatic-transition-from-open-to-half-open-enabled: true
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-size: 10
        wait-duration-in-open-state: 5s
        sliding-window-type: COUNT_BASED

# Actuator & Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.carrilloabogados: INFO
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"