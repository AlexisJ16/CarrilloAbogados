# =============================================================================
# API Gateway - Spring Cloud Gateway
# =============================================================================
# Default profile: Kubernetes (lb:// service discovery)
# Docker Compose: Use SPRING_PROFILES_ACTIVE=local (see application-local.yml)
# =============================================================================

server:
  port: 8080

spring:
  application:
    name: API-GATEWAY
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin, RETAIN_UNIQUE
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "${CLIENT_HOST:http://localhost:3000}"
              - "http://localhost:4200"
              - "http://localhost:3000"
            allowed-headers: "*"
            exposed-headers: "*"
            allow-credentials: true
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
      routes:
        - id: CLIENT-SERVICE
          uri: lb://CLIENT-SERVICE
          predicates:
            - Path=/client-service/**
        - id: CASE-SERVICE
          uri: lb://CASE-SERVICE
          predicates:
            - Path=/case-service/**
        - id: PAYMENT-SERVICE
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/payment-service/**
        - id: DOCUMENT-SERVICE
          uri: lb://DOCUMENT-SERVICE
          predicates:
            - Path=/document-service/**
        - id: CALENDAR-SERVICE
          uri: lb://CALENDAR-SERVICE
          predicates:
            - Path=/calendar-service/**
        - id: NOTIFICATION-SERVICE
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/notification-service/**
        - id: N8N-INTEGRATION-SERVICE
          uri: lb://N8N-INTEGRATION-SERVICE
          predicates:
            - Path=/n8n-integration-service/**

# Resilience4j Circuit Breaker
resilience4j:
  circuitbreaker:
    instances:
      apiGateway:
        register-health-indicator: true
        event-consumer-buffer-size: 10
        automatic-transition-from-open-to-half-open-enabled: true
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-size: 10
        wait-duration-in-open-state: 5s
        sliding-window-type: COUNT_BASED

# Actuator & Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"